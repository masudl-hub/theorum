id: thinking-is-not-a-tool
language: TypeScript
severity: error
message: thinking is a control, not a catalog tool. Do not put it on tools.allow.
rule:
  kind: string
  regex: '^thinking$'
  inside:
    kind: array
    stopBy: end
    inside:
      kind: pair
      has:
        kind: property_identifier
        regex: '^allow$'
      stopBy: end
