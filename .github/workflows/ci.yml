name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check mod.ts

      - name: Verify publish bundle
        run: deno task verify:publish

      - name: Test
        run: deno test --allow-read --allow-write --allow-net --allow-env --allow-sys --ignore=npm/ tests/
